<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="3,424 款 GitHub 开源安卓应用和游戏，140 个用途分类。支持中文功能搜索、应用图标和官方截图预览。">
<title>GitHub 开源安卓应用目录 · 3,424 款 Android 软件</title>
<style>
:root{color-scheme:light;--ink:#17251e;--muted:#4a6055;--paper:#f5f5ec;--card:#fffef7;--line:#d4ddd1;--accent:#14593f;--green:#d4f0d7;--deep:#173c2c;--shadow:0 12px 35px #1f3d2c12}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.63 "Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
a{color:var(--accent);text-underline-offset:.2em}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #5c9868;outline-offset:3px}
.wrap{width:min(1450px,calc(100% - 48px));margin:auto}
.hero{background:var(--deep);color:#f9fff3;padding:22px 0 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.brand{color:#cfead3;font-weight:700;letter-spacing:.02em;text-decoration:none}
.top a:last-child{color:#e7f4e4;font-size:14px}
.hero h1{font-size:clamp(33px,5.5vw,68px);margin:0 0 12px;font-weight:820;letter-spacing:-.07em;line-height:1.11}
.hero p{color:#d5e8d6;margin:0 0 23px;max-width:660px;font-size:16px}
.search{display:flex;gap:10px;max-width:750px}
.search input{background:#fffff7;color:var(--ink);border:1px solid transparent;min-width:0;flex:1;border-radius:12px;padding:13px 16px}
.search button{border:1px solid #6c9a7d;background:#285440;color:#fffef4;padding:8px 16px;border-radius:12px}
.columns{display:grid;grid-template-columns:218px minmax(0,1fr);gap:24px;padding:24px 0 40px}
.sidebar{align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.sidebar h2{font-size:16px;margin:0 0 12px}
.group{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--ink);border-radius:8px;padding:9px 10px;margin-bottom:3px}
.group[aria-current=true]{background:var(--green);font-weight:700;border-color:#bbd9c2}
.group:hover{background:#e7eee3}
.toolbar{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field select{display:block;width:100%;max-width:100%;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px}
.checks{display:flex;gap:20px;margin:10px 0 15px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.intro h2{font-size:clamp(21px,3vw,29px);margin:2px 0 1px;line-height:1.35}
.intro p{margin:0 0 12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 12px;display:flex;flex-direction:column;box-shadow:0 4px 15px #20392809}
.card-head{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.art{width:40px;height:40px;object-fit:contain;border-radius:9px;flex:0 0 40px;background:#eff2e8}
.card h3{font-size:17px;line-height:1.28;margin:0;overflow-wrap:anywhere}
.card .category{font-size:12px;color:var(--muted)}
.summary{margin:0 0 6px;overflow-wrap:anywhere;color:var(--ink)}
.detail{color:var(--muted);font-size:13px;margin:0 0 7px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 7px;padding:0;list-style:none}
.tags li{background:#eaf1e7;color:#234b37;font-size:11px;padding:2px 6px;border-radius:5px}
.links{margin-top:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;padding-top:6px}
.links button{color:var(--accent);border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:.2em}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
.pager button,.random{background:var(--card);color:var(--accent);border:1px solid #b9cdbb;padding:6px 10px;border-radius:8px}
.pager button:disabled{opacity:.45;cursor:default}
.empty{background:var(--card);padding:21px;border-radius:10px;grid-column:1 / -1}
.random{float:right;margin:3px 0 0 9px}
dialog{padding:0;border:1px solid var(--line);border-radius:14px;background:#fffff7;color:var(--ink);box-shadow:var(--shadow);width:min(850px,calc(100% - 25px));max-height:91vh}
dialog::backdrop{background:#0d241ce0}
.dialog-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dialog-head h2{font-size:17px;margin:0}
.dialog-head button{color:var(--ink);background:#e6eee4;border:0;border-radius:7px;padding:3px 10px}
.dialog-media{display:block;margin:auto;max-width:100%;max-height:76vh;object-fit:contain}
.dialog-links{padding:0 16px 12px;margin:9px 0 0;color:var(--muted)}
footer{padding:17px 0 25px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:740px){.columns{grid-template-columns:1fr;gap:10px}.sidebar{position:static}.sidebar h2{display:none}.groups{display:flex;overflow:auto;gap:5px;padding:2px 1px 8px}.group{white-space:nowrap;width:auto;margin:0;font-size:13px}.wrap{width:calc(100% - 24px)}.hero{padding-bottom:23px}.top{margin-bottom:18px}.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:490px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.search{gap:6px}.checks{gap:10px}}
</style>
</head>

<header class="hero">
  <div class="wrap">
    <div class="top"><a class="brand" href="#results">Android 开源应用</a><a href="https://github.com/QianLieXian/awesome-android-open-source-apps-zh">GitHub 分类目录</a></div>
    <h1>开源安卓应用目录</h1>
    <p>3,424 款应用，140 个小类。可以搜软件名，也可以搜想解决的事。</p>
    <form class="search" id="search-form" role="search">
      <input id="search" type="search" placeholder="试试 局域网、回合战棋、Root、图片压缩" aria-label="按软件名或功能搜索" autocomplete="off">
      <button id="clear" type="button">清空</button>

</header>
<div class="wrap columns">
  <nav class="sidebar" aria-label="应用大类"><h2>应用大类</h2><div class="groups" id="groups"></div></nav>
  <main id="results">
    <div class="toolbar">
      <label class="field"><span>子分类</span><select id="subgroup"></select></label>
      <label class="field"><span>具体用途</span><select id="section"></select></label>

    <div class="checks">

      <label><input id="has-zh" type="checkbox"> 有中文详解</label>

    <div class="intro">
      <button class="random" id="random" type="button">随机逛一款</button>
      <h2 id="result-title">应用目录</h2><p id="count" role="status" aria-live="polite"></p>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager" aria-label="翻页">
      <button id="prev" type="button">上一页</button><span id="position"></span><button id="next" type="button">下一页</button>
    </div>
    <noscript>卡片搜索需要启用 JavaScript。也可以浏览 <a href="https://github.com/QianLieXian/awesome-android-open-source-apps-zh/tree/main/catalog">GitHub 分类页</a>。</noscript>
  </main>
</div>
<dialog id="detail-dialog">

<script>
'use strict';
(async () => {
const data = document.getElementById('app-data').textContent.trim();
const compressed = Uint8Array.from(atob(data), char => char.charCodeAt(0));
const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
const dataset = JSON.parse(await new Response(stream).text());
const get = id => document.getElementById(id);
const search = get('search');
const subgroup = get('subgroup');
const section = get('section');
const sorting = get('sort');
const gallery = get('grid');
const dialog = get('detail-dialog');
const categories = new Map(dataset.sections.map(item => [item.id,item]));
const clusters = new Map(dataset.subgroups.map(item => [item.id,item]));
const byRepo = new Map(dataset.apps.map(item => [item.repo,item]));
const title = new Map(dataset.families.map(item => [item.id,item.label]));
const featured = new Set(dataset.featured);
const pageSize = 24;
const aliases = new Map([
  ['图片压缩',['图片','压缩']], ['文件互传',['文件','互传']],
  ['日语学习',['日语','学习']], ['开源战棋',['回合战棋']],
  ['离线地图',['离线地图']], ['安卓模拟器',['模拟']],
]);
let group = '';
let currentPage = 0;
let result = [];
const escape = value => String(value).replace(/[&<>"']/g, part => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[part]));
const keywords = value => value.toLowerCase().normalize('NFKC').replace(/[\u200b-\u200d\u2060]/g,'').trim();
const indexed = dataset.apps.map(app => {
  const category = categories.get(app.section);
  const cluster = clusters.get(app.slug);
  return {app, category, searchable: keywords([app.name,app.repo,app.summary,app.detail,app.pkg,category.label,cluster.label,title.get(category.family),...app.tags].join(' '))};
});
const familyButtons = [{id:'',label:'全部用途'},...dataset.families];
get('groups').innerHTML = familyButtons.map(item => '<button class="group" type="button" data-group="' + escape(item.id) + '">' + escape(item.label) + '</button>').join('');

function loadSections() {
  const target = clusters.get(subgroup.value);
  const options = dataset.sections.filter(item => (!group || item.family === group) && (!target || target.leaves.includes(item.id)));
  section.innerHTML = '<option value="">全部小类</option>' + options.map(item =>
    '<option value="' + escape(item.id) + '">' + escape(item.label) + ' · ' + item.count + '</option>').join('');
  get('groups').querySelectorAll('button').forEach(button => button.setAttribute('aria-current', String(button.dataset.group === group)));
}
function loadSubgroups() {
  const options = dataset.subgroups.filter(item => !group || item.family === group);
  subgroup.innerHTML = '<option value="">全部子分类</option>' + options.map(item =>
    '<option value="' + escape(item.id) + '">' + escape(item.label) + ' · ' + item.count + '</option>').join('');
  subgroup.value = '';
  loadSections();
}
function pageLink(app) {
  return app.pkg ? 'https://f-droid.org/packages/' + app.pkg + '/' : 'https://github.com/' + app.repo + '/releases';
}
function displayCard({app, category}) {
  const address = 'https://github.com/' + app.repo;
  const alt = app.name + ' ' + app.image_type;
  const picture = '<img class="art" loading="lazy" width="40" height="40" src="' + escape(app.icon) + '" alt="' + escape(alt) + '">';
  const tagList = app.tags.length ? '<ul class="tags">' + app.tags.map(tag => '<li>' + escape(tag) + '</li>').join('') + '</ul>' : '';
  return '<article class="card"><div class="card-head">' + picture + '<div><h3>' + escape(app.name) + '</h3>' +
    '<div class="category">' + escape(category.label) + '</div></div></div><p class="summary">' + escape(app.summary) + '</p>' +
    (app.detail ? '<p class="detail">' + escape(app.detail) + '</p>' : '') + tagList + '<div class="links">' +
    '<a href="' + escape(address) + '">GitHub</a><a href="' + escape(pageLink(app)) + '">' + (app.pkg ? 'F-Droid' : '版本发布') + '</a>' +
    (app.shot ? '<button type="button" data-image="' + escape(app.repo) + '">看截图</button>' : '') + '</div></article>';
}
function draw() {
  const start = currentPage * pageSize;
  gallery.innerHTML = result.length ? result.slice(start,start+pageSize).map(displayCard).join('') : '<p class="empty">没有匹配应用。可以去掉部分关键词或切换分类。</p>';
  get('prev').disabled = currentPage === 0;
  get('next').disabled = start+pageSize >= result.length;
  get('position').textContent = result.length ? (currentPage+1) + ' / ' + Math.ceil(result.length/pageSize) : '0 / 0';
  get('random').disabled = !result.length;
}
function filter() {
  const words = keywords(search.value).split(/\s+/).filter(Boolean).flatMap(word => aliases.get(word) || [word]);
  result = indexed.filter(({app, category, searchable}) =>
    (!group || category.family === group) && (!subgroup.value || app.slug === subgroup.value) && (!section.value || app.section === section.value) &&
    (!get('has-shot').checked || app.shot) && (!get('has-zh').checked || app.editorial) &&
    words.every(word => searchable.includes(word))
  );
  const mode = sorting.value;
  if (mode === 'name') result.sort((a,b) => a.app.name.localeCompare(b.app.name,'zh-Hans'));
  if (mode === 'updated') result.sort((a,b) => b.app.date.localeCompare(a.app.date) || b.app.stars-a.app.stars);
  if (mode === 'star') result.sort((a,b) => b.app.stars-a.app.stars);
  if (mode === 'recommended' && !words.length && !group && !section.value) {
    result.sort((a,b) => Number(featured.has(b.app.repo))-Number(featured.has(a.app.repo)));
  }
  currentPage = 0;
  get('result-title').textContent = section.value ? categories.get(section.value).label : clusters.get(subgroup.value)?.label || title.get(group) || (words.length ? '搜索结果' : '浏览全部');
  get('count').textContent = result.length.toLocaleString('zh-CN') + ' 款应用';
  draw();
}
function openDetails(app, showShot) {
  get('dialog-title').textContent = app.name;
  const links = '<a href="https://github.com/' + escape(app.repo) + '">打开 GitHub</a> · <a href="' +
    escape(pageLink(app)) + '">' + (app.pkg ? 'F-Droid' : '版本发布') + '</a>';
  get('dialog-content').innerHTML = showShot && app.shot ?
    '<img class="dialog-media" src="' + escape(app.shot) + '" alt="' + escape(app.name) + '实际界面"><p class="dialog-links">' + links + ' · <a href="' + escape(app.shot) + '">查看原图</a></p>' :
    '<div class="dialog-links">' + displayCard({app,category:categories.get(app.section)}) + '</div>';
  if (!dialog.open) dialog.showModal();
}
get('groups').addEventListener('click', event => {
  const tapped = event.target.closest('[data-group]');
  if (!tapped) return;
  group = tapped.dataset.group;
  loadSubgroups();
  filter();
});
get('search-form').addEventListener('submit', event => {event.preventDefault();filter();});
get('clear').addEventListener('click', () => {
  search.value = '';
  group = '';
  get('has-shot').checked = false;
  get('has-zh').checked = false;
  sorting.value = 'recommended';
  loadSubgroups();
  filter();
  search.focus();
});
search.addEventListener('input', filter);
subgroup.addEventListener('change', () => {loadSections(); filter();});
[section, sorting, get('has-shot'), get('has-zh')].forEach(element => element.addEventListener('change',filter));
[get('prev'), get('next')].forEach(button => button.addEventListener('click', () => {
  currentPage += button.id === 'next' ? 1 : -1;
  draw();
  get('result-title').scrollIntoView({block:'start'});
}));
document.addEventListener('click', event => {
  const target = event.target.closest('[data-image]');
  if (target) openDetails(byRepo.get(target.dataset.image), true);
  if (event.target === dialog) dialog.close();
});
get('random').addEventListener('click', () => {
  if (result.length) openDetails(result[Math.floor(Math.random()*result.length)].app, false);
});
loadSubgroups();
filter();
})().catch(error => {
  console.error(error);
  document.getElementById('count').textContent = '目录加载失败。请用新版 Edge、Chrome 或 Firefox 打开，也可以直接浏览 GitHub 分类。';
});
</script>
</body>
</html>
